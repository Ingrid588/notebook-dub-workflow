version: 1
source: notebooklm
course: "AWS Certified Generative AI Developer Professional"
notes: "字幕直译了大量讲师的英文口语习惯（如 So, You know, Basically, Well 等），导致产生了极多无意义的口水词（“你知道”、“好吧”、“呃”）。此外，诸如“所以我所做的是”、“这就是我们所说的”等从句直译非常生硬，占用大量时间，可通过整段删除赘词和精简长句来大幅缩减字数。"
drop_phrases:
  - "所以我所做的是"
  - "需要注意的是"
  - "我们要做的就是"
  - "在这种情况下"
  - "你知道的，"
  - "你知道，"
  - "你知道"
  - "那么，"
  - "嗯，"
  - "呃，"
  - "好吧，"
  - "事实上，"
  - "基本上，"
  - "基本上"
  - "实际上，"
  - "实际上"
  - "因此，"
  - "所以，"
  - "请您"
literal_replacements:
  - ["这就是我们所说的", "这就是"]
  - ["我们将详细讨论", "我们将详述"]
  - ["我们不打算讨论", "我们不讨论"]
  - ["我们将讨论", "接下来看"]
  - ["以某种方式", ""]
  - ["进行配置", "配置"]
  - ["设置一个", "设置"]
  - ["创建一个", "创建"]
  - ["进行一个", ""]
  - ["来实现", ""]
  - ["的就是", "是"]
  - ["你需要", "你"]
  - ["您需要", "您"]
  - ["正确的。", "对吧。"]
  - ["进行", ""]
  - ["以便", ""]
  - ["从而", ""]
  - ["的话", ""]